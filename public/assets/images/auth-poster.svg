<svg xmlns=http://www.w3.org/2000/svg viewBox=0 0 1920 1080 width=100% height=100%>
  <defs>
    <radialGradient id=bg cx=50% cy=50% r=75%>
      <stop offset=0% stop-color=#0f766e stop-opacity=0.35/>
      <stop offset=50% stop-color=#0b1120 stop-opacity=0.85/>
      <stop offset=100% stop-color=#060913 stop-opacity=1/>
    </radialGradient>
    <radialGradient id=warmGlow cx=30% cy=25% r=50%>
      <stop offset=0% stop-color=#ea580c stop-opacity=0.2/>
      <stop offset=100% stop-color=#ea580c stop-opacity=0/>
    </radialGradient>
    <radialGradient id=tealGlow cx=70% cy=75% r=50%>
      <stop offset=0% stop-color=#14b8a6 stop-opacity=0.25/>
      <stop offset=100% stop-color=#14b8a6 stop-opacity=0/>
    </radialGradient>
    <filter id=blur>
      <feGaussianBlur stdDeviation=40/>
    </filter>
  </defs>
  <rect width=100% height=100% fill=#0B1120/>
  <rect width=100% height=100% fill=url(#bg)/>
  <circle cx=450 cy=300 r=350 fill=url(#warmGlow) filter=url(#blur)/>
  <circle cx=1400 cy=750 r=450 fill=url(#tealGlow) filter=url(#blur)/>
  <g stroke=#14b8a6 stroke-opacity=0.15 stroke-width=1.5>
    <line x1=300 y1=200 x2=550 y2=380/>
    <line x1=550 y1=380 x2=800 y2=250/>
    <line x1=800 y1=250 x2=1100 y2=400/>
    <line x1=1100 y1=400 x2=1400 y2=280/>
    <line x1=550 y1=380 x2=700 y2=600/>
    <line x1=700 y1=600 x2=1000 y2=650/>
    <line x1=1000 y1=650 x2=1300 y2=550/>
    <line x1=1300 y1=550 x2=1600 y2=700/>
  </g>
  <g fill=#2dd4bf fill-opacity=0.3>
    <circle cx=300 cy=200 r=4/>
    <circle cx=550 cy=380 r=6/>
    <circle cx=800 cy=250 r=5/>
    <circle cx=1100 cy=400 r=7/>
    <circle cx=1400 cy=280 r=4/>
    <circle cx=700 cy=600 r=5/>
    <circle cx=1000 cy=650 r=6/>
    <circle cx=1300 cy=550 r=5/>
    <circle cx=1600 cy=700 r=4/>
  </g>
</svg>
